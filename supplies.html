<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>소모품 구매 이력 · 수요부서</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root{
  --bg:#f4f6fb; --panel:#fff; --line:#e2e7f0; --text:#101729; --text-2:#5a6377;
  --accent:#2563eb; --accent-soft:#eef3ff;
  --ok:#0f9d58; --warn:#d97706;
  --radius:18px; --shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1118; --panel:#161a23; --line:#262c3a; --text:#e9ecf4; --text-2:#99a1b3;
        --accent:#7f9cff; --accent-soft:rgba(127,156,255,.13);
        --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:30px 20px 48px}

.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:6px}
h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.8px}
.sub{font-size:12px;color:var(--text-2)}
.spacer{flex:1}
.btn{padding:7px 13px;border:1px solid var(--line);background:var(--panel);border-radius:10px;
  font-size:12.5px;font-weight:700;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent);color:var(--accent)}

.lead{margin:12px 0 0;font-size:13.5px;color:var(--text-2);max-width:760px}
.lead b{color:var(--text)}

.stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;
  box-shadow:var(--shadow);min-width:132px}
.stat__k{display:block;font-size:11px;font-weight:700;color:var(--text-2)}
.stat__v{display:block;margin-top:2px;font-size:20px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.stat__v small{font-size:12px;font-weight:700;margin-left:2px;color:var(--text-2)}
.stat__c{display:block;font-size:11px;color:var(--text-2);margin-top:1px}

.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:20px}
.bar input{flex:1;min-width:230px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;
  background:var(--panel);color:var(--text);font:inherit;font-size:13.5px}
.bar input:focus{outline:none;border-color:var(--accent)}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);
  font-size:12px;font-weight:700;color:var(--text-2);cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.count{margin:12px 2px 8px;font-size:12px;color:var(--text-2)}
.count b{color:var(--text)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:auto;max-height:calc(100vh - 380px);box-shadow:var(--shadow)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;z-index:2;background:var(--panel);font-size:11.5px;font-weight:700;
  color:var(--text-2);box-shadow:inset 0 -1px 0 var(--line)}
td.name{white-space:normal;min-width:260px;font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--accent-soft)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10.5px;font-weight:700;color:#fff}
.tag.sui{background:var(--warn)} .tag.bid{background:var(--accent)} .tag.etc{background:var(--text-2)}
.empty{padding:44px;text-align:center;color:var(--text-2)}
.more{padding:11px;text-align:center;font-size:12px;color:var(--text-2)}

footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--text-2)}
footer b{color:var(--text)}
.dot{opacity:.45}
@media (max-width:620px){ .wrap{padding:22px 14px 36px} h1{font-size:21px} }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <h1>소모품 구매 이력</h1>
    <span class="sub">수요부서 · 조회 전용</span>
    <span class="spacer"></span>
    <a class="btn" href="index.html">← 수요부서 포털</a>
  </div>

  <p class="lead">
    품목별 <b>판정</b>은 <b>최근 1년 구매 빈도</b>로 정하며, 동수이면 <b>최종 구매</b>의 계약방식을 따릅니다.
    <b>입찰-소모품</b>은 입찰구매요청, <b>수의계약</b>은 소모품 구매요청으로 상신합니다.
    주 거래처는 최근 1년 최다 납품업체입니다. <b>단가와 금액은 담지 않았습니다.</b>
  </p>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <input type="search" id="q" placeholder="품명 · 품목코드 · 거래처로 검색" autocomplete="off" />
    <button type="button" class="chip on" data-b="">전체</button>
    <button type="button" class="chip" data-b="수의계약">수의계약</button>
    <button type="button" class="chip" data-b="입찰">입찰</button>
    <button type="button" class="chip" data-b="올해">올해 구매</button>
  </div>

  <div class="count" id="count"></div>
  <div class="box"><table><thead><tr>
    <th>품명</th><th>구분</th><th>판정</th><th>최근 1년</th><th>주 거래처</th><th>최근 구매</th><th class="n">건수</th><th>구매 연도</th>
  </tr></thead><tbody id="rows"></tbody></table></div>

  <footer>
    <span><b>(재)FITI시험연구원</b> 사업지원본부 · 전략구매팀</span>
    <span class="dot">·</span><span>소모품 구매 이력 v1.2</span>
    <span class="dot">·</span><span>문의 : 전략구매팀 (내선 8124)</span>
  </footer>

</div>

<!-- 자료 : data/supplies.json — 구매 이력에서 단가·금액을 뺀 것입니다.
     품명 · 구분 · 계약방식 · 거래처 · 구매일 · 건수만 들어 있습니다. -->
<script>
(function () {
  var DATA = [], view = [], pick = '', LIMIT = 300;
  var THIS_YEAR = String(new Date().getFullYear());

  var $ = function (s) { return document.querySelector(s); };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c];
    });
  }
  function nf(n) { return Number(n || 0).toLocaleString('ko-KR'); }

  /* 계약방식은 여러 가지가 섞인 품목이 있습니다. 화면에서는 그대로 다 보여 줍니다. */
  function tagOf(b) {
    if (/수의/.test(b)) return 'sui';
    if (/입찰/.test(b)) return 'bid';
    return 'etc';
  }
  function bizHtml(list) {
    return (list || []).map(function (b) {
      return '<span class="tag ' + tagOf(b) + '">' + esc(b) + '</span>';
    }).join(' ') || '<span class="tag etc">-</span>';
  }

  /* 판정 — 최근 1년 입찰(rb) · 수의(rs) 건수 중 많은 쪽, 같으면 최종 구매(lb) 방식.
     「소모품」(소모품 구매요청)은 수의계약입니다. 입찰-사업비도 계약방식은 입찰이라 입찰-소모품으로 봅니다. */
  function verdict(r) {
    var rb = r.rb || 0, rs = r.rs || 0;
    var lastBid = /입찰/.test(r.lb || '') || (!r.lb && (r.b || []).every(function (b) { return /입찰/.test(b); }));
    return (rb > rs || (rb === rs && lastBid)) ? 'bid' : 'sui';
  }
  function verdictHtml(r) {
    return verdict(r) === 'bid'
      ? '<span class="tag bid">입찰-소모품</span>'
      : '<span class="tag sui">수의계약</span>';
  }
  function recentHtml(r) {
    if (!r.lb) return '<span style="color:var(--text-2)">-</span>';
    return '입찰 ' + (r.rb || 0) + ' · 수의 ' + (r.rs || 0)
      + '<div style="font-size:11px;color:var(--text-2)">최종 ' + esc(r.lb) + '</div>';
  }

  function stats() {
    var sui = 0, bid = 0, ven = {}, now = 0;
    DATA.forEach(function (r) {
      if (verdict(r) === 'sui') sui++; else bid++;
      if ((r.y || []).indexOf(THIS_YEAR) >= 0) now++;
      if (r.v) ven[r.v] = 1;
    });
    function cell(k, v, u, c) {
      return '<div class="stat"><span class="stat__k">' + k + '</span>'
        + '<span class="stat__v">' + nf(v) + (u ? '<small>' + u + '</small>' : '') + '</span>'
        + (c ? '<span class="stat__c">' + c + '</span>' : '') + '</div>';
    }
    $('#stats').innerHTML =
        cell('등록 품목', DATA.length, '종', '구매 이력이 있는 것')
      + cell('판정 · 수의계약', sui, '종', Math.round(sui / DATA.length * 100) + '%')
      + cell('판정 · 입찰-소모품', bid, '종', Math.round(bid / DATA.length * 100) + '%')
      + cell(THIS_YEAR + '년에 산 것', now, '종', '올해 구매 이력')
      + cell('거래처', Object.keys(ven).length, '곳', '대표 거래처 기준');
  }

  function match(r, q) {
    if (!q) return true;
    return (r.n + ' ' + r.c + ' ' + (r.v || '') + ' ' + (r.mv || '') + ' ' + (r.lv || '')).toLowerCase().indexOf(q) >= 0;
  }
  function pass(r) {
    if (!pick) return true;
    if (pick === '올해') return (r.y || []).indexOf(THIS_YEAR) >= 0;
    return verdict(r) === (pick === '입찰' ? 'bid' : 'sui');
  }
  function venHtml(r) {
    var main = r.mv || r.v || '-';
    var s = esc(main) + (r.mvn ? ' <span style="color:var(--text-2)">' + r.mvn + '건</span>' : '');
    if (r.lv && r.lv !== main) s += '<div style="font-size:11px;color:var(--text-2)">최근 ' + esc(r.lv) + '</div>';
    return s;
  }

  function render() {
    var q = ($('#q').value || '').trim().toLowerCase();
    view = DATA.filter(function (r) { return pass(r) && match(r, q); })
               .sort(function (a, b) { return String(b.l).localeCompare(String(a.l)); });

    $('#count').innerHTML = '<b>' + nf(view.length) + '</b>종'
      + (view.length > LIMIT ? ' · 최근 구매일 순으로 ' + nf(LIMIT) + '종만 보여 줍니다' : ' · 최근 구매일 순');

    if (!view.length) {
      $('#rows').innerHTML = '<tr><td class="empty" colspan="8">찾으시는 품목이 없습니다.</td></tr>';
      return;
    }
    var html = view.slice(0, LIMIT).map(function (r) {
      return '<tr>'
        + '<td class="name">' + esc(r.n) + '<div class="sub" style="font-size:11px;color:var(--text-2)">' + esc(r.c) + '</div></td>'
        + '<td>' + esc(r.k || '-') + '</td>'
        + '<td>' + verdictHtml(r) + '</td>'
        + '<td>' + recentHtml(r) + '</td>'
        + '<td>' + venHtml(r) + '</td>'
        + '<td>' + esc(r.l || '-') + '</td>'
        + '<td class="n">' + nf(r.cnt) + '</td>'
        + '<td>' + esc((r.y || []).join(' · ')) + '</td>'
        + '</tr>';
    }).join('');
    if (view.length > LIMIT) {
      html += '<tr><td class="more" colspan="8">검색어를 넣으면 더 좁혀집니다</td></tr>';
    }
    $('#rows').innerHTML = html;
  }

  /* 포털 칩에서 ?b=수의계약 처럼 넘어옵니다 — 눌린 채로 열려야 「수의냐 입찰이냐」가 바로 보입니다. */
  function fromUrl() {
    var m = /[?&]b=([^&]*)/.exec(location.search);
    if (!m) return;
    var want = '';
    try { want = decodeURIComponent(m[1].split("+").join(" ")); } catch (e) { return; }
    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (b) {
      var on = b.dataset.b === want;
      if (on) pick = want;
      b.classList.toggle('on', on);
    });
  }

  var deb;
  $('#q').addEventListener('input', function () { clearTimeout(deb); deb = setTimeout(render, 180); });
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (b) {
    b.addEventListener('click', function () {
      pick = b.dataset.b;
      Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (x) {
        x.classList.toggle('on', x === b);
      });
      render();
    });
  });

  fetch('data/supplies.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) { DATA = j || []; stats(); fromUrl(); render(); })
    .catch(function (e) {
      $('#rows').innerHTML = '<tr><td class="empty" colspan="8">자료를 불러오지 못했습니다. (' + esc(e.message) + ')</td></tr>';
    });
})();
</script>
</body>
</html>
